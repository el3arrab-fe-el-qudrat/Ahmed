<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الصفحة غير موجودة — العراب في القدرات</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!--
      GitHub Pages serves this file for ANY unknown path, at any depth, so it
      cannot rely on relative asset URLs. It is therefore fully self-contained:
      no stylesheet, script or image requests at all. The only thing that needs
      to know the site root is the two links, and the script at the bottom
      resolves that at runtime.
    -->
    <style>
      :root {
        --bg: #f7f5f1;
        --surface: #fff;
        --ink: #182234;
        --ink-2: #55607a;
        --accent: #7a2229;
        --gold: #a87538;
        --border: #e6e1d8;
        --wash-gold: rgba(180, 133, 79, 0.13);
        --wash-accent: rgba(24, 34, 52, 0.09);
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: var(--bg);
        /* Plain rgba rather than color-mix(): the same wash as the main site,
           and it rasterises reliably everywhere. */
        background-image: radial-gradient(120% 100% at 88% -20%, var(--wash-gold), transparent 58%),
          radial-gradient(90% 90% at 8% -30%, var(--wash-accent), transparent 60%);
        color: var(--ink);
        font-family: "IBM Plex Sans Arabic", "Segoe UI", "Noto Sans Arabic", system-ui, sans-serif;
        font-size: 0.9375rem;
        line-height: 1.7;
        text-align: center;
      }

      .wrap {
        max-width: 520px;
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        padding: 0.375rem 0.875rem;
        margin-block-end: 2rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--ink-2);
      }

      .mark::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
      }

      .code {
        font-size: clamp(3.5rem, 2rem + 7vw, 6rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      h1 {
        margin-block: 0.75rem;
        font-size: clamp(1.3rem, 1.1rem + 0.7vw, 1.55rem);
        line-height: 1.25;
        font-weight: 700;
      }

      p.lead {
        margin-block-end: 2rem;
        color: var(--ink-2);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
      }

      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 1rem;
        border: 1px solid transparent;
        border-radius: 10px;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 180ms, border-color 180ms;
      }

      a.primary {
        background: var(--accent);
        color: #fff;
      }

      a.primary:hover {
        filter: brightness(1.08);
      }

      a.secondary {
        background: var(--surface);
        color: var(--ink);
        border-color: var(--border);
      }

      a.secondary:hover {
        border-color: var(--ink-2);
      }

      a:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <main class="wrap">
      <p class="mark">العراب في القدرات — الأستاذ أحمد طلعت</p>

      <p class="code" aria-hidden="true">404</p>
      <h1>لم نجد هذه الصفحة</h1>
      <p class="lead">
        ربما تغيّر الرابط أو كُتب بشكل غير صحيح. عُد إلى الصفحة الرئيسية وابحث عن النموذج الذي
        تريده بالاسم أو بالرقم.
      </p>

      <div class="actions">
        <a class="btn primary" id="homeLink" href="/">العودة إلى الرئيسية</a>
        <a class="btn secondary" id="examsLink" href="/#exams">تصفّح النماذج</a>
      </div>
    </main>

    <script>
      /* Resolve the site root. On a GitHub Pages *project* site the first path
         segment is the repository name; on a user/organisation site or a custom
         domain the root is simply "/". */
      (function () {
        var base = '/';
        var host = location.hostname;
        var segments = location.pathname.split('/').filter(Boolean);
        if (/\.github\.io$/i.test(host) && segments.length > 0) base = '/' + segments[0] + '/';
        document.getElementById('homeLink').setAttribute('href', base);
        document.getElementById('examsLink').setAttribute('href', base + '#exams');
      })();
    </script>
  </body>
</html>
